<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="BMG Check-In">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0a1628">
    <meta name="color-scheme" content="dark light">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icon-192.png">
    <title>BMG Fleet - Vehicle Check-In</title>
    <script src="https://cdn.jsdelivr.net/npm/monday-sdk-js/dist/main.js"></script>
    <style>
        /* BMG Ops Design System - Dark & Light Mode */
        :root {
            --bg: #0a1628;
            --card: #0d1f35;
            --border: #1e2d3d;
            --navy: #ee3120;
            --navy-light: #5b9bd5;
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --text-muted: #64748b;
            --success: #34d399;
            --success-bg: rgba(52, 211, 153, 0.08);
            --warning: #fbbf24;
            --warning-bg: rgba(251, 191, 36, 0.08);
            --error: #f87171;
            --error-bg: rgba(248, 113, 113, 0.08);
            --tab-active-bg: rgba(238, 49, 32, 0.06);
            --logo-display-dark: block;
            --logo-display-light: none;
        }

        [data-theme="light"] {
            --bg: #f8fafc;
            --card: #ffffff;
            --border: #e2e8f0;
            --navy: #ee3120;
            --navy-light: #1e5a8a;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --success: #10b981;
            --success-bg: rgba(16, 185, 129, 0.1);
            --warning: #f59e0b;
            --warning-bg: rgba(245, 158, 11, 0.1);
            --error: #ef4444;
            --error-bg: rgba(239, 68, 68, 0.1);
            --tab-active-bg: rgba(238, 49, 32, 0.08);
            --logo-display-dark: none;
            --logo-display-light: block;
        }

        @media (prefers-color-scheme: light) {
            :root:not([data-theme="dark"]) {
                --bg: #f8fafc;
                --card: #ffffff;
                --border: #e2e8f0;
                --navy: #ee3120;
                --navy-light: #1e5a8a;
                --text-primary: #0f172a;
                --text-secondary: #475569;
                --text-muted: #94a3b8;
                --success: #10b981;
                --success-bg: rgba(16, 185, 129, 0.1);
                --warning: #f59e0b;
                --warning-bg: rgba(245, 158, 11, 0.1);
                --error: #ef4444;
                --error-bg: rgba(239, 68, 68, 0.1);
                --tab-active-bg: rgba(238, 49, 32, 0.08);
                --logo-display-dark: none;
                --logo-display-light: block;
            }
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 16px;
            padding-top: max(16px, env(safe-area-inset-top));
            padding-bottom: max(16px, env(safe-area-inset-bottom));
            transition: background 0.3s, color 0.3s;
        }

        .container { max-width: 480px; margin: 0 auto; }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }

        .logo-container { height: 40px; }
        .logo-container img { height: 100%; width: auto; }
        .logo-dark { display: var(--logo-display-dark); }
        .logo-light { display: var(--logo-display-light); }

        .theme-toggle {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px;
            cursor: pointer;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .theme-toggle:hover { border-color: var(--navy); color: var(--navy); }
        .theme-toggle svg { width: 20px; height: 20px; }

        .section-label {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 12px;
            margin-bottom: 12px;
            transition: background 0.3s, border-color 0.3s;
        }
        .card-success { border-color: rgba(52, 211, 153, 0.3); background: var(--success-bg); }

        /* Tab Switcher - matches BMG Ops exactly */
        .tabs {
            display: flex;
            gap: 4px;
            background: var(--card);
            border-radius: 10px;
            padding: 3px;
            margin-bottom: 12px;
        }
        .tab {
            flex: 1;
            padding: 8px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s;
        }
        .tab.active { background: var(--tab-active-bg); color: var(--navy); }

        .steps {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-bottom: 20px;
        }
        .step {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
        }
        .step.active { color: var(--navy); }
        .step.complete { color: var(--success); }
        .step-number {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--card);
            border: 2px solid currentColor;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 11px;
        }
        .step.complete .step-number { background: var(--success); border-color: var(--success); color: #fff; }

        .input-group { margin-bottom: 12px; }
        .input-label {
            display: block;
            font-size: 10px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }
        .input-wrapper { position: relative; }

        input[type="text"] {
            width: 100%;
            padding: 12px 14px;
            padding-left: 44px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--text-primary);
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }
        input[type="text"]:focus { outline: none; border-color: var(--navy); }
        input::placeholder { color: var(--text-muted); }

        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            width: 18px;
            height: 18px;
        }

        #vinInput {
            text-transform: uppercase;
            font-family: 'SF Mono', Monaco, 'Courier New', monospace;
            font-size: 18px;
            letter-spacing: 2px;
            font-weight: 700;
            text-align: center;
            padding-left: 14px;
        }

        .char-count {
            text-align: center;
            margin-top: 6px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
        }
        .char-count.valid { color: var(--success); }

        .btn {
            width: 100%;
            padding: 14px 20px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-primary { background: var(--navy); color: #fff; }
        .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-success { background: var(--success); color: #fff; }
        .btn-secondary {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            font-weight: 700;
            font-size: 13px;
            padding: 10px 16px;
        }
        .btn-ghost {
            background: var(--tab-active-bg);
            border: 1px solid rgba(238, 49, 32, 0.15);
            color: var(--navy);
            font-weight: 700;
        }
        .btn .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .status {
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 12px;
            display: none;
        }
        .status.visible { display: block; }
        .status.error { background: var(--error-bg); border: 1px solid rgba(248,113,113,0.15); color: var(--error); }
        .status.success { background: var(--success-bg); border: 1px solid rgba(52,211,153,0.15); color: var(--success); }
        .status.warning { background: var(--warning-bg); border: 1px solid rgba(251,191,36,0.15); color: var(--warning); }

        /* Camera View - Inline like BMG Ops */
        .camera-container {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
            height: 300px;
            margin-bottom: 8px;
        }
        .camera-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .camera-guide {
            position: absolute;
            top: 50%;
            left: 3%;
            right: 3%;
            height: 70px;
            margin-top: -35px;
            border: 3px solid rgba(238, 49, 32, 0.7);
            border-radius: 10px;
            pointer-events: none;
            box-shadow: 0 0 20px rgba(238, 49, 32, 0.2);
        }
        .camera-status {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 10px;
            background: rgba(0, 0, 0, 0.7);
            text-align: center;
        }
        .camera-status-text {
            font-size: 13px;
            color: #fff;
            font-weight: 700;
        }
        .camera-status-found {
            font-size: 13px;
            color: var(--warning);
            margin-top: 3px;
            font-family: monospace;
            font-weight: 800;
        }
        .camera-status-scanning {
            font-size: 12px;
            color: #9ca3af;
            margin-top: 3px;
        }
        .camera-error {
            padding: 20px;
            text-align: center;
            background: var(--error-bg);
            border: 1px solid rgba(248, 113, 113, 0.15);
            border-radius: 14px;
        }
        .camera-error-text {
            color: var(--error);
            font-size: 13px;
            margin-bottom: 12px;
        }

        .vehicle-info { display: none; }
        .vehicle-info.visible { display: block; }
        .vehicle-info-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 12px;
        }
        .vehicle-info-item {
            background: var(--bg);
            padding: 10px;
            border-radius: 10px;
            text-align: center;
        }
        .vehicle-info-label {
            font-size: 10px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .vehicle-info-value { font-size: 15px; font-weight: 800; margin-top: 2px; }

        .results { display: none; margin-top: 16px; }
        .results.visible { display: block; }
        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
        }
        .results-title { font-weight: 700; font-size: 14px; }
        .results-count {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            background: var(--card);
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid var(--border);
        }

        .order-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .order-card:hover { border-color: var(--navy); }
        .order-card.selected { border-color: var(--success); background: var(--success-bg); }
        .order-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .order-number { font-family: 'SF Mono', Monaco, monospace; font-weight: 800; font-size: 14px; color: var(--navy); }
        .order-status {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            padding: 4px 8px;
            border-radius: 6px;
            background: var(--success-bg);
            color: var(--success);
        }
        .order-customer { font-weight: 600; font-size: 13px; margin-bottom: 4px; }
        .order-vin { font-family: monospace; font-size: 11px; color: var(--navy-light); }

        .graphics-section { display: none; margin-top: 16px; }
        .graphics-section.visible { display: block; }
        .graphics-header {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 13px;
            color: var(--navy-light);
            margin-bottom: 12px;
        }
        .folder-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
        .folder-btn {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
            color: var(--text-primary);
        }
        .folder-btn:hover { border-color: var(--navy-light); }
        .folder-btn.selected { border-color: var(--success); background: var(--success-bg); }
        .folder-name { font-weight: 700; font-size: 13px; }
        .folder-count { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

        .proof-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 8px;
            margin-top: 12px;
            max-height: 280px;
            overflow-y: auto;
        }
        .proof-thumb {
            background: var(--bg);
            border: 2px solid var(--border);
            border-radius: 10px;
            padding: 4px;
            cursor: pointer;
            position: relative;
            transition: all 0.2s;
        }
        .proof-thumb:hover { border-color: var(--navy-light); }
        .proof-thumb.selected { border-color: var(--success); }
        .proof-thumb img { width: 100%; height: 80px; object-fit: contain; background: #fff; border-radius: 6px; }
        .proof-thumb-placeholder {
            width: 100%;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--card);
            border-radius: 6px;
            color: var(--text-muted);
            font-size: 10px;
        }
        .proof-thumb-name {
            font-size: 9px;
            color: var(--text-muted);
            margin-top: 4px;
            text-align: center;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .proof-thumb-version {
            position: absolute;
            top: 6px;
            right: 6px;
            background: var(--navy);
            color: #fff;
            font-size: 9px;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 4px;
        }
        .proof-thumb-check {
            position: absolute;
            bottom: 28px;
            right: 6px;
            background: var(--success);
            color: #fff;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 10px;
        }
        .proof-thumb.selected .proof-thumb-check { display: flex; }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 12px;
        }
        .back-link:hover { color: var(--navy-light); }

        .confirmation { text-align: center; padding: 32px 0; }
        .confirmation-icon {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: var(--success-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            font-size: 28px;
            color: var(--success);
        }
        .confirmation-title { font-size: 18px; font-weight: 800; margin-bottom: 8px; }
        .confirmation-details {
            text-align: left;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 16px;
            margin: 20px 0;
            font-size: 13px;
        }
        .confirmation-details p { margin-bottom: 6px; color: var(--text-secondary); }
        .confirmation-details strong { color: var(--text-primary); }

        .settings-section { margin-top: 32px; padding-top: 20px; border-top: 1px solid var(--border); }
        .settings-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }
        .settings-panel {
            display: none;
            margin-top: 16px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 16px;
        }
        .settings-panel.visible { display: block; }
        .settings-panel input { padding-left: 14px !important; }

        .panel { display: none; }
        .panel.active { display: block; }

        .button-row { display: flex; gap: 8px; margin-top: 12px; }
        .button-row .btn { flex: 1; }

        .loading { text-align: center; padding: 40px 0; }
        .loading-spinner {
            width: 36px;
            height: 36px;
            border: 3px solid var(--border);
            border-top-color: var(--navy);
            border-radius: 50%;
            margin: 0 auto;
            animation: spin 1s linear infinite;
        }
        .loading-text { color: var(--navy-light); font-weight: 600; margin-top: 12px; font-size: 13px; }

        .empty-state { text-align: center; padding: 32px 0; color: var(--text-muted); }
        .empty-state-icon { font-size: 36px; margin-bottom: 8px; opacity: 0.4; }
        .empty-state-text { font-weight: 600; font-size: 13px; }

        /* Hidden canvas for barcode processing */
        #scanCanvas { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="logo-container">
                <img src="/bmg-logo-white.png" alt="BMG Fleet" class="logo-dark">
                <img src="/bmg-logo-color.png" alt="BMG Fleet" class="logo-light">
            </div>
            <button class="theme-toggle" onclick="toggleTheme()" title="Toggle theme">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="5"/>
                    <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
                </svg>
            </button>
        </header>

        <div class="steps">
            <div class="step active" id="step1"><span class="step-number">1</span><span>VIN</span></div>
            <div class="step" id="step2"><span class="step-number">2</span><span>Customer</span></div>
            <div class="step" id="step3"><span class="step-number">3</span><span>Confirm</span></div>
        </div>

        <!-- Panel 1: VIN Entry -->
        <div id="panel1" class="panel active">
            <div class="section-label">Scan VIN</div>
            
            <!-- Mode Tabs - exactly like BMG Ops -->
            <div class="tabs">
                <button class="tab" id="tabCamera" onclick="switchToCamera()">Camera</button>
                <button class="tab active" id="tabText" onclick="switchToText()">Type / Scanner</button>
            </div>

            <!-- Camera Mode -->
            <div id="cameraMode" style="display: none;">
                <div id="cameraError" class="camera-error" style="display: none;">
                    <div class="camera-error-text" id="cameraErrorText"></div>
                    <button class="btn btn-primary" onclick="switchToText()">Switch to Text Input</button>
                </div>
                <div id="cameraView">
                    <div class="camera-container">
                        <video id="video" playsinline muted></video>
                        <div class="camera-guide"></div>
                        <div class="camera-status">
                            <div id="cameraStatusContent">
                                <div class="camera-status-text">Starting camera...</div>
                            </div>
                        </div>
                    </div>
                    <canvas id="scanCanvas"></canvas>
                </div>
            </div>

            <!-- Text Mode -->
            <div id="textMode">
                <input type="text" id="vinInput" placeholder="Enter or scan 17-char VIN" maxlength="17" autocomplete="off" autofocus>
                <div id="charCount" class="char-count">0/17</div>
            </div>

            <div id="vehicleInfo" class="card card-success vehicle-info">
                <div style="display: flex; align-items: center; gap: 8px; color: var(--success); font-weight: 700; font-size: 13px;">
                    <span>✓</span> Vehicle Identified
                </div>
                <div class="vehicle-info-grid">
                    <div class="vehicle-info-item">
                        <div class="vehicle-info-label">Year</div>
                        <div class="vehicle-info-value" id="decodedYear">—</div>
                    </div>
                    <div class="vehicle-info-item">
                        <div class="vehicle-info-label">Make</div>
                        <div class="vehicle-info-value" id="decodedMake">—</div>
                    </div>
                    <div class="vehicle-info-item">
                        <div class="vehicle-info-label">Model</div>
                        <div class="vehicle-info-value" id="decodedModel">—</div>
                    </div>
                </div>
            </div>

            <div id="vinStatus" class="status"></div>

            <div id="textModeButtons">
                <button class="btn btn-primary" id="decodeBtn" onclick="handleManualDecode()" disabled style="margin-top: 16px;">Decode VIN</button>
            </div>
        </div>

        <!-- Panel 2: Customer Search -->
        <div id="panel2" class="panel">
            <div class="section-label">Customer & Sales Order</div>

            <div class="input-group">
                <label class="input-label">Customer Name</label>
                <div class="input-wrapper">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                        <circle cx="9" cy="7" r="4"/>
                    </svg>
                    <input type="text" id="customerInput" placeholder="Search customer..." autocomplete="off">
                </div>
            </div>

            <button class="btn btn-primary" id="searchBtn" onclick="searchCustomer()">🔍 Search Sales Orders</button>

            <div class="input-group" style="margin-top: 16px;">
                <label class="input-label">End User (Graphics) <span style="font-weight: 400; text-transform: none; font-size: 10px; color: var(--text-muted);">— if different from customer</span></label>
                <div class="input-wrapper">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="18" height="18" rx="2"/>
                        <circle cx="8.5" cy="8.5" r="1.5"/>
                        <polyline points="21 15 16 10 5 21"/>
                    </svg>
                    <input type="text" id="endUserInput" placeholder="End user for graphics..." autocomplete="off">
                </div>
            </div>

            <button class="btn btn-ghost" onclick="loadEndUserGraphics()">📁 Load Graphics for End User</button>

            <div class="button-row">
                <button class="btn btn-secondary" onclick="goToStep1()">← Back</button>
            </div>

            <div id="statusMessage" class="status"></div>

            <div id="graphicsSection" class="graphics-section card">
                <div class="graphics-header">🖼️ <span id="graphicsTitle">Graphics Proofs</span></div>
                <div id="graphicsContent"></div>
            </div>

            <div id="resultsSection" class="results">
                <div class="results-header">
                    <span class="results-title">Sales Orders</span>
                    <span class="results-count" id="resultsCount">0</span>
                </div>
                <div id="resultsContainer"></div>
                <button class="btn btn-success" id="confirmBtn" style="display: none; margin-top: 12px;" onclick="confirmSelection()">✓ Confirm Selection</button>
            </div>
        </div>

        <!-- Panel 3: Confirmation -->
        <div id="panel3" class="panel">
            <div class="confirmation">
                <div class="confirmation-icon">✓</div>
                <div class="confirmation-title">Vehicle Checked In!</div>
                <div class="confirmation-details" id="confirmationDetails"></div>
                <button class="btn btn-primary" onclick="startOver()">↻ Check In Another Vehicle</button>
            </div>
        </div>

        <div class="settings-section">
            <div class="settings-toggle" onclick="toggleSettings()">⚙️ Settings</div>
            <div id="settingsPanel" class="settings-panel">
                <div class="input-group">
                    <label class="input-label">API URL</label>
                    <input type="text" id="apiUrlInput" placeholder="https://...">
                </div>
                <div class="input-group">
                    <label class="input-label">Monday.com API Token</label>
                    <input type="text" id="mondayTokenInput" placeholder="Enter token...">
                </div>
                <button class="btn btn-success" onclick="saveSettings()" style="margin-top: 12px;">Save Settings</button>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/@zxing/library@latest"></script>
    <script>
        // ========== THEME ==========
        function getPreferredTheme() {
            const saved = localStorage.getItem('bmg_theme');
            if (saved) return saved;
            return window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('bmg_theme', theme);
            const meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', theme === 'light' ? '#f8fafc' : '#0a1628');
        }
        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme') || getPreferredTheme();
            setTheme(current === 'dark' ? 'light' : 'dark');
        }
        setTheme(getPreferredTheme());
        window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', (e) => {
            if (!localStorage.getItem('bmg_theme')) setTheme(e.matches ? 'light' : 'dark');
        });

        // ========== CONFIG ==========
        const DEFAULT_API = 'https://bmg-entry-production.up.railway.app';
        const NHTSA = 'https://vpic.nhtsa.dot.gov/api/vehicles/DecodeVinValues';
        let API = localStorage.getItem('bmg_api_url') || DEFAULT_API;

        // ========== STATE ==========
        let currentVIN = '';
        let currentCustomer = '';
        let selectedOrder = null;
        let graphicsProof = null;
        let decodedVehicle = { year: '', make: '', model: '' };
        let folderProofs = [];
        let selectedFolder = '';
        let graphicsCustomer = '';

        // Scanner state - matching BMG Ops exactly
        let mode = 'text';
        let cameraActive = false;
        let lastScanned = '';
        let scanCount = 0;
        let foundVin = false;
        let streamRef = null;
        let intervalRef = null;
        let readerRef = null;
        let zxingLib = null;

        // ========== VIN VALIDATION - Same as BMG Ops ==========
        function isValidVIN(vin) {
            if (!vin || vin.length !== 17) return false;
            // VINs cannot contain I, O, or Q
            if (/[IOQ]/i.test(vin)) return false;
            return /^[A-HJ-NPR-Z0-9]{17}$/i.test(vin);
        }

        // ========== SCANNER - Matching BMG Ops exactly ==========
        async function startCamera() {
            document.getElementById('cameraError').style.display = 'none';
            foundVin = false;
            lastScanned = '';
            scanCount = 0;

            try {
                // Dynamic import of zxing
                if (!zxingLib) {
                    zxingLib = await import('https://unpkg.com/@zxing/library@latest/esm/index.js');
                }

                // Configure formats - same as BMG Ops
                const formats = [
                    zxingLib.BarcodeFormat.CODE_128,
                    zxingLib.BarcodeFormat.CODE_39,
                    zxingLib.BarcodeFormat.CODE_93,
                    zxingLib.BarcodeFormat.DATA_MATRIX,
                    zxingLib.BarcodeFormat.QR_CODE,
                    zxingLib.BarcodeFormat.PDF_417,
                    zxingLib.BarcodeFormat.ITF,
                ];

                const hints = new Map();
                hints.set(zxingLib.DecodeHintType.POSSIBLE_FORMATS, formats);
                hints.set(zxingLib.DecodeHintType.TRY_HARDER, true);

                const reader = new zxingLib.MultiFormatReader();
                reader.setHints(hints);
                readerRef = reader;

                // Get camera stream - same settings as BMG Ops
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: 'environment',
                        width: { ideal: 1920 },
                        height: { ideal: 1080 },
                    }
                });
                streamRef = stream;

                const video = document.getElementById('video');
                video.srcObject = stream;
                await video.play();
                cameraActive = true;

                updateCameraStatus();

                // Start scanning at 200ms intervals - same as BMG Ops
                intervalRef = setInterval(() => scanFrame(), 200);

            } catch (e) {
                let errorMsg = 'Camera error: ' + (e.message || 'Unknown error');
                if (e.name === 'NotAllowedError' || (e.message && e.message.includes('Permission'))) {
                    errorMsg = 'Camera permission denied. Allow camera access in your browser settings, or use text input.';
                } else if (e.name === 'NotFoundError') {
                    errorMsg = 'No camera found. Use text input instead.';
                }
                document.getElementById('cameraErrorText').textContent = errorMsg;
                document.getElementById('cameraError').style.display = 'block';
                document.getElementById('cameraView').style.display = 'none';
            }
        }

        function stopCamera() {
            if (intervalRef) {
                clearInterval(intervalRef);
                intervalRef = null;
            }
            if (streamRef) {
                streamRef.getTracks().forEach(t => t.stop());
                streamRef = null;
            }
            const video = document.getElementById('video');
            if (video) video.srcObject = null;
            cameraActive = false;
        }

        function scanFrame() {
            if (foundVin) return;

            const video = document.getElementById('video');
            const canvas = document.getElementById('scanCanvas');
            if (!video || !canvas || !readerRef) return;
            if (video.readyState !== video.HAVE_ENOUGH_DATA) return;

            const ctx = canvas.getContext('2d');
            if (!ctx) return;

            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0);

            scanCount++;
            updateCameraStatus();

            try {
                // Manual luminance conversion - same as BMG Ops
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const len = imageData.data.length / 4;
                const luminances = new Uint8ClampedArray(len);
                for (let i = 0; i < len; i++) {
                    const r = imageData.data[i * 4];
                    const g = imageData.data[i * 4 + 1];
                    const b = imageData.data[i * 4 + 2];
                    luminances[i] = Math.round(0.299 * r + 0.587 * g + 0.114 * b);
                }

                const source = new zxingLib.RGBLuminanceSource(luminances, canvas.width, canvas.height);
                const bitmap = new zxingLib.BinaryBitmap(new zxingLib.HybridBinarizer(source));
                const decoded = readerRef.decode(bitmap);
                const raw = decoded.getText().trim().toUpperCase().replace(/[^A-HJ-NPR-Z0-9]/g, '');

                lastScanned = raw;
                updateCameraStatus();

                // Auto-process if valid 17-char VIN - same as BMG Ops
                if (raw.length === 17 && isValidVIN(raw)) {
                    foundVin = true;
                    stopCamera();
                    currentVIN = raw;
                    document.getElementById('vinInput').value = raw;
                    updateCharCount(17);
                    if (navigator.vibrate) navigator.vibrate(200);
                    decodeAndProceed(raw);
                }
            } catch (e) {
                // No barcode found in this frame - this is normal
            }
        }

        function updateCameraStatus() {
            const content = document.getElementById('cameraStatusContent');
            if (cameraActive) {
                if (lastScanned) {
                    content.innerHTML = `
                        <div class="camera-status-text">Hold 4-8 in from barcode</div>
                        <div class="camera-status-found">FOUND: ${lastScanned} (${lastScanned.length} chars)</div>
                    `;
                } else {
                    content.innerHTML = `
                        <div class="camera-status-text">Hold 4-8 in from barcode</div>
                        <div class="camera-status-scanning">Scanning... ${scanCount} frames</div>
                    `;
                }
            } else {
                content.innerHTML = '<div class="camera-status-text">Starting camera...</div>';
            }
        }

        function switchToCamera() {
            mode = 'camera';
            document.getElementById('tabCamera').classList.add('active');
            document.getElementById('tabText').classList.remove('active');
            document.getElementById('cameraMode').style.display = 'block';
            document.getElementById('textMode').style.display = 'none';
            document.getElementById('textModeButtons').style.display = 'none';
            document.getElementById('cameraView').style.display = 'block';
            document.getElementById('cameraError').style.display = 'none';
            setTimeout(() => startCamera(), 300);
        }

        function switchToText() {
            stopCamera();
            mode = 'text';
            document.getElementById('tabCamera').classList.remove('active');
            document.getElementById('tabText').classList.add('active');
            document.getElementById('cameraMode').style.display = 'none';
            document.getElementById('textMode').style.display = 'block';
            document.getElementById('textModeButtons').style.display = 'block';
            document.getElementById('vinInput').focus();
        }

        // ========== VIN PROCESSING ==========
        async function decodeAndProceed(vin) {
            await decodeVIN(vin);
            goToStep2();
        }

        async function decodeVIN(vin) {
            document.getElementById('vehicleInfo').classList.add('visible');
            try {
                const r = await fetch(`${NHTSA}/${vin}?format=json`);
                const d = await r.json();
                if (d.Results?.[0]) {
                    decodedVehicle = {
                        year: d.Results[0].ModelYear || '',
                        make: d.Results[0].Make || '',
                        model: d.Results[0].Model || ''
                    };
                    document.getElementById('decodedYear').textContent = decodedVehicle.year || '—';
                    document.getElementById('decodedMake').textContent = decodedVehicle.make || '—';
                    document.getElementById('decodedModel').textContent = decodedVehicle.model || '—';
                }
            } catch (e) {
                console.error('VIN decode error:', e);
            }
        }

        function handleManualDecode() {
            const v = document.getElementById('vinInput').value.trim().toUpperCase();
            if (!isValidVIN(v)) {
                showStatus('vinStatus', 'Invalid VIN - must be 17 characters', 'warning');
                return;
            }
            currentVIN = v;
            decodeAndProceed(v);
        }

        function updateCharCount(len) {
            const el = document.getElementById('charCount');
            el.textContent = `${len}/17${len === 17 ? ' ✓' : ''}`;
            el.classList.toggle('valid', len === 17);
            document.getElementById('decodeBtn').disabled = len !== 17;
        }

        // ========== PANEL NAVIGATION ==========
        function showPanel(n) {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.getElementById(`panel${n}`).classList.add('active');
            updateSteps(n);
        }

        function updateSteps(n) {
            for (let i = 1; i <= 3; i++) {
                const s = document.getElementById(`step${i}`);
                s.classList.remove('active', 'complete');
                if (i < n) s.classList.add('complete');
                else if (i === n) s.classList.add('active');
            }
        }

        function goToStep1() {
            showPanel(1);
            if (mode === 'text') {
                document.getElementById('vinInput').focus();
            }
        }

        function goToStep2() {
            if (currentVIN.length !== 17) {
                showStatus('vinStatus', 'VIN must be 17 characters', 'warning');
                return;
            }
            showPanel(2);
            hideEl('statusMessage');
            hideEl('resultsSection');
            hideEl('graphicsSection');
            document.getElementById('customerInput').focus();
        }

        function goToStep3() {
            showPanel(3);
            const v = [decodedVehicle.year, decodedVehicle.make, decodedVehicle.model].filter(Boolean).join(' ') || 'N/A';
            const proof = graphicsProof 
                ? `<span style="color: var(--navy-light);">${graphicsProof.file_name}</span>` 
                : '<span style="color: var(--warning);">Not selected</span>';
            
            document.getElementById('confirmationDetails').innerHTML = selectedOrder
                ? `<p><strong>Customer:</strong> ${selectedOrder.customer_name}</p>
                   <p><strong>VIN:</strong> <span style="font-family: monospace;">${currentVIN}</span></p>
                   <p><strong>Vehicle:</strong> ${v}</p>
                   <p><strong>Order:</strong> ${selectedOrder.sales_order_number}</p>
                   <p><strong>Graphics:</strong> ${proof}</p>`
                : `<p><strong>Customer:</strong> ${currentCustomer}</p>
                   <p><strong>VIN:</strong> <span style="font-family: monospace;">${currentVIN}</span></p>
                   <p><strong>Vehicle:</strong> ${v}</p>
                   <p><strong>Order:</strong> <span style="color: var(--warning);">Missing</span></p>
                   <p><strong>Graphics:</strong> ${proof}</p>`;
        }

        function startOver() {
            currentVIN = '';
            currentCustomer = '';
            selectedOrder = null;
            graphicsProof = null;
            folderProofs = [];
            decodedVehicle = { year: '', make: '', model: '' };
            foundVin = false;
            lastScanned = '';
            scanCount = 0;
            document.getElementById('vinInput').value = '';
            document.getElementById('customerInput').value = '';
            document.getElementById('endUserInput').value = '';
            document.getElementById('vehicleInfo').classList.remove('visible');
            updateCharCount(0);
            hideEl('resultsSection');
            hideEl('graphicsSection');
            hideEl('statusMessage');
            hideEl('vinStatus');
            goToStep1();
        }

        // ========== UTILITIES ==========
        function showStatus(id, msg, type) {
            const s = document.getElementById(id);
            s.className = `status visible ${type}`;
            s.textContent = msg;
        }

        function hideEl(id) {
            const e = document.getElementById(id);
            if (e) {
                e.style.display = 'none';
                e.classList.remove('visible');
            }
        }

        // ========== CUSTOMER SEARCH ==========
        async function searchCustomer() {
            const name = document.getElementById('customerInput').value.trim();
            if (!name) {
                showStatus('statusMessage', 'Enter customer name', 'warning');
                return;
            }
            currentCustomer = name;
            
            const btn = document.getElementById('searchBtn');
            btn.disabled = true;
            btn.innerHTML = '<div class="spinner"></div>';
            
            hideEl('statusMessage');
            hideEl('resultsSection');
            hideEl('graphicsSection');

            try {
                const r = await fetch(`${API}/sales-orders/customer/${encodeURIComponent(name)}`);
                const d = await r.json();
                
                if (d.found && d.data?.length) {
                    window.searchResults = d.data;
                    showStatus('statusMessage', `Found ${d.count} order(s)`, 'success');
                    showResults(d.data);
                } else {
                    showStatus('statusMessage', 'No orders found', 'warning');
                    document.getElementById('resultsSection').style.display = 'block';
                    document.getElementById('resultsSection').classList.add('visible');
                    document.getElementById('resultsContainer').innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon">📋</div>
                            <div class="empty-state-text">No sales orders found</div>
                        </div>
                        <button class="btn btn-ghost" onclick="createMissing()" style="margin-top: 12px;">Check In Anyway</button>
                    `;
                }

                const endUser = document.getElementById('endUserInput').value.trim();
                if (!endUser) {
                    await loadFolders(name);
                }
            } catch (e) {
                showStatus('statusMessage', `API error: ${e.message}`, 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '🔍 Search Sales Orders';
            }
        }

        function showResults(orders) {
            document.getElementById('resultsCount').textContent = orders.length;
            document.getElementById('resultsContainer').innerHTML = orders.map((o, i) => `
                <div class="order-card" onclick="selectOrder(${i})">
                    <div class="order-header">
                        <span class="order-number">${o.sales_order_number || 'N/A'}</span>
                        <span class="order-status">${{A:'Pending',B:'Fulfillment',D:'Billing',E:'Partial'}[o.status] || 'Open'}</span>
                    </div>
                    <div class="order-customer">${o.customer_name}</div>
                    ${o.vin ? `<div class="order-vin">VIN: ${o.vin}</div>` : ''}
                </div>
            `).join('');
            
            document.getElementById('resultsSection').style.display = 'block';
            document.getElementById('resultsSection').classList.add('visible');
            document.getElementById('confirmBtn').style.display = 'none';
        }

        function selectOrder(i) {
            document.querySelectorAll('.order-card').forEach((c, j) => c.classList.toggle('selected', j === i));
            selectedOrder = window.searchResults[i];
            document.getElementById('confirmBtn').style.display = 'flex';
            
            if (selectedOrder.vin && selectedOrder.vin.length === 17) {
                currentVIN = selectedOrder.vin;
                document.getElementById('vinInput').value = selectedOrder.vin;
                updateCharCount(17);
                decodeVIN(selectedOrder.vin);
            }
        }

        // ========== GRAPHICS ==========
        async function loadFolders(customer) {
            graphicsCustomer = customer;
            const section = document.getElementById('graphicsSection');
            const content = document.getElementById('graphicsContent');
            
            section.classList.add('visible');
            section.style.display = 'block';
            document.getElementById('graphicsTitle').textContent = 'Loading folders...';
            content.innerHTML = '<div class="loading"><div class="loading-spinner"></div></div>';

            try {
                const r = await fetch(`${API}/graphics/customer/${encodeURIComponent(customer)}/folders`);
                const d = await r.json();
                
                if (d.found && d.folders?.length) {
                    document.getElementById('graphicsTitle').textContent = `Graphics Folders (${d.count})`;
                    content.innerHTML = '<div class="folder-grid">' + d.folders.map(f => `
                        <button class="folder-btn" onclick="loadFolderProofs('${f.name.replace(/'/g, "\\'")}')">
                            <div class="folder-name">${f.name}</div>
                            <div class="folder-count">${f.proof_count} files</div>
                        </button>
                    `).join('') + '</div>';
                } else {
                    document.getElementById('graphicsTitle').textContent = 'No Graphics Found';
                    content.innerHTML = '<div class="empty-state"><div class="empty-state-text">No folders found</div></div>';
                }
            } catch (e) {
                content.innerHTML = '<div class="empty-state"><div class="empty-state-text">API error</div></div>';
            }
        }

        async function loadFolderProofs(folderName) {
            selectedFolder = folderName;
            const content = document.getElementById('graphicsContent');
            document.getElementById('graphicsTitle').textContent = `Loading ${folderName}...`;
            content.innerHTML = '<div class="loading"><div class="loading-spinner"></div><div class="loading-text">Generating thumbnails...</div></div>';

            try {
                const r = await fetch(`${API}/graphics/customer/${encodeURIComponent(graphicsCustomer)}/folder/${encodeURIComponent(folderName)}/proofs`);
                const d = await r.json();
                
                if (d.found && d.proofs?.length) {
                    folderProofs = d.proofs;
                    document.getElementById('graphicsTitle').textContent = `${folderName} (${d.count} proofs)`;
                    content.innerHTML = `
                        <div class="back-link" onclick="loadFolders('${graphicsCustomer.replace(/'/g, "\\'")}')">← Back to folders</div>
                        <div class="proof-gallery">
                            ${d.proofs.map((p, i) => `
                                <div class="proof-thumb" onclick="selectProof(${i})">
                                    ${p.thumbnail_base64 
                                        ? `<img src="data:image/png;base64,${p.thumbnail_base64}">` 
                                        : '<div class="proof-thumb-placeholder">No preview</div>'}
                                    ${p.version ? `<span class="proof-thumb-version">v${p.version}</span>` : ''}
                                    <span class="proof-thumb-check">✓</span>
                                    <div class="proof-thumb-name">${p.file_name}</div>
                                </div>
                            `).join('')}
                        </div>
                    `;
                } else {
                    content.innerHTML = `
                        <div class="back-link" onclick="loadFolders('${graphicsCustomer.replace(/'/g, "\\'")}')">← Back</div>
                        <div class="empty-state"><div class="empty-state-text">No proofs in this folder</div></div>
                    `;
                }
            } catch (e) {
                content.innerHTML = '<div class="empty-state"><div class="empty-state-text">Error loading proofs</div></div>';
            }
        }

        function selectProof(i) {
            graphicsProof = folderProofs[i];
            graphicsProof.folder = selectedFolder;
            document.querySelectorAll('.proof-thumb').forEach((t, j) => t.classList.toggle('selected', j === i));
        }

        async function loadEndUserGraphics() {
            const endUser = document.getElementById('endUserInput').value.trim();
            if (!endUser) {
                alert('Enter an end user name');
                return;
            }
            await loadFolders(endUser);
        }

        // ========== CONFIRMATION ==========
        async function confirmSelection() {
            if (!selectedOrder) {
                showStatus('statusMessage', 'Select an order', 'warning');
                return;
            }
            
            const btn = document.getElementById('confirmBtn');
            btn.disabled = true;
            btn.innerHTML = '<div class="spinner"></div>';

            try {
                await createMondayItem(selectedOrder);
                goToStep3();
            } catch (e) {
                showStatus('statusMessage', 'Error: ' + e.message, 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '✓ Confirm Selection';
            }
        }

        async function createMissing() {
            selectedOrder = null;
            try {
                await createMondayItem(null);
                goToStep3();
            } catch (e) {
                showStatus('statusMessage', 'Error: ' + e.message, 'error');
            }
        }

        async function createMondayItem(order) {
            let API_TOKEN = localStorage.getItem('monday_api_token');
            if (!API_TOKEN) {
                alert('Set Monday API token in Settings');
                return;
            }

            const BOARD_ID = '18396250282';
            const cols = {
                text_mkzrg53a: currentVIN,
                text_mkzr3q83: decodedVehicle.year,
                text_mkzrxd5b: decodedVehicle.make,
                text_mkzrmkj8: decodedVehicle.model,
                date_mkzrp9m1: { date: new Date().toISOString().split('T')[0] },
                color_mkzrv4bb: { label: 'Received' },
                color_mkzv2vf3: { label: order ? 'Found' : 'Missing' }
            };
            
            if (order?.sales_order_number) cols.text_mkzr8a99 = order.sales_order_number;
            
            const name = order?.customer_name || currentCustomer;
            const colsJson = JSON.stringify(JSON.stringify(cols));
            const query = `mutation { create_item (board_id: ${BOARD_ID}, item_name: "${name.replace(/"/g, '')}", column_values: ${colsJson}) { id } }`;
            
            const response = await fetch('https://api.monday.com/v2', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': API_TOKEN },
                body: JSON.stringify({ query })
            });
            
            const result = await response.json();
            if (result.errors) throw new Error(result.errors[0].message);

            if (graphicsProof?.relative_path && result.data?.create_item?.id) {
                const itemId = result.data.create_item.id;
                try {
                    await fetch(`${API}/monday/upload-file?` + new URLSearchParams({
                        item_id: itemId,
                        column_id: 'file_mkzv3s01',
                        file_path: graphicsProof.relative_path,
                        api_token: API_TOKEN
                    }), { method: 'POST' });
                } catch (e) {
                    console.error('Graphics upload failed:', e);
                }
            }

            if (order?.id && result.data?.create_item?.id) {
                const itemId = result.data.create_item.id;
                try {
                    await fetch(`${API}/monday/upload-sales-order-pdf?` + new URLSearchParams({
                        item_id: itemId,
                        column_id: 'file_mkzv44b3',
                        sales_order_id: order.id,
                        api_token: API_TOKEN
                    }), { method: 'POST' });
                } catch (e) {
                    console.error('SO PDF upload failed:', e);
                }
            }
        }

        // ========== SETTINGS ==========
        function toggleSettings() {
            const panel = document.getElementById('settingsPanel');
            panel.classList.toggle('visible');
            if (panel.classList.contains('visible')) {
                document.getElementById('apiUrlInput').value = API;
                document.getElementById('mondayTokenInput').value = localStorage.getItem('monday_api_token') || '';
            }
        }

        function saveSettings() {
            const url = document.getElementById('apiUrlInput').value.trim();
            if (url) {
                API = url.replace(/\/$/, '');
                localStorage.setItem('bmg_api_url', API);
            }
            const token = document.getElementById('mondayTokenInput').value.trim();
            if (token) localStorage.setItem('monday_api_token', token);
            showStatus('vinStatus', 'Settings saved!', 'success');
            setTimeout(() => hideEl('vinStatus'), 2000);
            toggleSettings();
        }

        async function initMondayToken() {
            if (!localStorage.getItem('monday_api_token')) {
                try {
                    const r = await fetch(`${API}/config/monday-token`);
                    if (r.ok) {
                        const data = await r.json();
                        if (data.token) localStorage.setItem('monday_api_token', data.token);
                    }
                } catch (e) {}
            }
        }

        // ========== INIT ==========
        document.addEventListener('DOMContentLoaded', () => {
            const savedApi = localStorage.getItem('bmg_api_url');
            if (savedApi) API = savedApi;
            initMondayToken();
            
            // VIN input handling
            document.getElementById('vinInput').addEventListener('input', (e) => {
                const v = e.target.value.toUpperCase().replace(/[^A-HJ-NPR-Z0-9]/gi, '').slice(0, 17);
                e.target.value = v;
                updateCharCount(v.length);
                if (v.length === 17) {
                    decodeVIN(v);
                } else {
                    document.getElementById('vehicleInfo').classList.remove('visible');
                }
            });

            document.getElementById('vinInput').addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && document.getElementById('vinInput').value.length === 17) {
                    handleManualDecode();
                }
            });

            document.getElementById('customerInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') searchCustomer();
            });
        });

        // Cleanup on page unload
        window.addEventListener('beforeunload', () => stopCamera());

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js').catch(err => console.log('SW error:', err));
        }
    </script>
</body>
</html>
